# How the FORL app and its widget extension are put together.
#
# The project file Xcode opens is generated from this, so the shape of the app
# is reviewed here as a dozen readable lines rather than in a pbxproj nobody can
# read. The generated project is committed beside it, so opening the app in
# Xcode needs nothing installed.
#
# Both targets use the same development team so macOS allows the widget to
# read the app's shared container. The App Group uses that team's identifier.

name: FORL
options:
  bundleIdPrefix: io.forl
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: "66YH3B9VCL"
    FORL_APP_GROUP: "$(DEVELOPMENT_TEAM).io.forl"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  FORL:
    type: application
    platform: macOS
    preBuildScripts:
      - name: Cut the shared app icon
        script: |
          set -eu
          bash "$SRCROOT/Tools/GenerateAppIcon.sh" "$SRCROOT/../common/assets/icon.png" "$SRCROOT/FORL/Resources/AppIcon.xcassets/AppIcon.appiconset"
        inputFiles:
          - $(SRCROOT)/Tools/GenerateAppIcon.sh
          - $(SRCROOT)/../common/assets/icon.png
        outputFiles:
          - $(SRCROOT)/FORL/Resources/AppIcon.xcassets/AppIcon.appiconset/Contents.json
    sources:
      - path: FORL
        excludes: ["Resources/Info.plist", "Resources/FORL.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.forl.app
        PRODUCT_NAME: FORL
        INFOPLIST_FILE: FORL/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: FORL/Resources/FORL.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: FORLWidgets
        embed: true
        codeSign: true

  FORLWidgets:
    type: app-extension
    platform: macOS
    preBuildScripts:
      - name: Generate Control Center gauges
        script: |
          set -eu
          xcrun swiftc -parse-as-library "$SRCROOT/Tools/GenerateControlSymbols.swift" "$SRCROOT/FORL/Design/DialGeometry.swift" -o "$DERIVED_FILE_DIR/GenerateControlSymbols"
          "$DERIVED_FILE_DIR/GenerateControlSymbols" "$SRCROOT" "$SRCROOT/FORLWidgets/Resources/ControlSymbols.xcassets"
        inputFiles:
          - $(SRCROOT)/Tools/GenerateControlSymbols.swift
          - $(SRCROOT)/FORL/Design/DialGeometry.swift
          - $(SRCROOT)/../common/assets/claude.svg
          - $(SRCROOT)/../common/assets/chatgpt.svg
        outputFiles:
          - $(SRCROOT)/FORLWidgets/Resources/ControlSymbols.xcassets/Contents.json
    sources:
      - path: FORLWidgets
        excludes: ["Info.plist", "FORLWidgets.entitlements"]
      - path: FORL/Core
      - path: FORL/Design
      - path: FORL/Settings
      # The marks only. The app icon has a catalog of its own, which this target
      # has no use for and which its own build phase writes into.
      - path: FORL/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.forl.app.widgets
        PRODUCT_NAME: FORLWidgets
        INFOPLIST_FILE: FORLWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: FORLWidgets/FORLWidgets.entitlements
        SKIP_INSTALL: YES
